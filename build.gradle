plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'java'
    id 'com.diffplug.spotless' version '7.0.3'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// MC 26.1.1 não usa ofuscação — desabilita o intermediário de mapeamentos.
loom {
    noIntermediateMappings()
}

// MC 26.1.1 exige Java 25 (java-runtime-epsilon).
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

spotless {
    java {
        trimTrailingWhitespace()
        endWithNewline()
        // Ordem de imports: java/javax → outros (mojang, mixin…) → net.minecraft → net.fabricmc → projeto
        importOrder('java', 'javax', '', 'net.minecraft', 'net.fabricmc', 'com.jovinull')
        removeUnusedImports()
    }
    groovyGradle {
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencies {
    // Minecraft 26.1.1 é distribuído sem ofuscação — sem linha mappings.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Fabric Loader e API (sem remapeamento — configurações padrão)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Instala os git hooks automaticamente ao buildar (funciona para todos os contribuintes)
tasks.register('installGitHooks') {
    group = 'setup'
    description = 'Configura o diretório de git hooks para .githooks/'
    onlyIf { file('.git').isDirectory() }
    doLast {
        exec { commandLine 'git', 'config', 'core.hooksPath', '.githooks' }
        file('.githooks/pre-commit').setExecutable(true)
        logger.lifecycle('[OmniTweaks] Git hooks instalados em .githooks/')
    }
}

tasks.named('build') {
    dependsOn 'installGitHooks'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
