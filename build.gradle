plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// MC 26.1.1 não usa ofuscação — desabilita o intermediário de mapeamentos.
loom {
    noIntermediateMappings()
}

// O ambiente local usa JDK 25. A flag --release 25 é necessária pois MC 26.1.1
// requer Java 25 (java-runtime-epsilon).
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

dependencies {
    // Minecraft 26.1.1 é distribuído sem ofuscação — sem linha mappings.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Fabric Loader e API (sem remapeamento — configurações padrão)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
